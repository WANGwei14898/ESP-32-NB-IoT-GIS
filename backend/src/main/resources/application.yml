server:
  port: 8080

spring:
  application:
    name: flood-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/flood_monitor?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  mail:
    host: smtp.example.com
    port: 587
    username: your-email@example.com
    password: your-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# MQTT 配置
mqtt:
  broker: tcp://localhost:1883
  client-id: flood-backend
  username: "Wangwei"
  password: "123456"
  clean-session: true
  keep-alive: 60
  qos: 1
  topic: flood/+/telemetry

# CoAP 配置
coap:
  enabled: true
  host: 0.0.0.0
  port: 5683

# 数据源模式配置
# mode：real=仅接收真实硬件数据(esp32)；simulated=仅接收模拟数据(simulator)；both=两者都接收
# simulated-alert：模拟数据是否触发告警引擎（false 可避免模拟数据产生大量假告警）
# 对应环境变量：DATA_MODE、DATA_SIMULATED_ALERT
data:
  mode: both
  simulated-alert: false

# 预测服务配置（Python 预测服务地址）
prediction:
  base-url: http://localhost:8000
  default-model: moving_average
  default-minutes: 60
  schedule-interval-ms: 300000

# 告警推送配置
push:
  mail:
    to: alert@example.com
    from: no-reply@urbanflood.local
  sms-target: "13800000000"
  webhook-url: ""

# JWT 配置
jwt:
  secret: urban-flood-monitor-secret-key-please-change-2026
  expire-minutes: 1440

logging:
  level:
    com.urbanflood: info
