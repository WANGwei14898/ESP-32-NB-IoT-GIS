; ============================================================
; 城市内涝监测 - ESP32 水位监测固件（PlatformIO 配置）
; ============================================================
; 编译烧录：
;   pio run                 # 编译
;   pio run -t upload       # 烧录
;   pio device monitor      # 串口监视
; ============================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; 依赖库：
;   PubSubClient   —— MQTT 客户端
;   ArduinoJson    —— JSON 序列化（可选，本项目手工拼接以减小体积）
lib_deps =
    knolleary/PubSubClient@^2.8

; 串口输出过滤（减少刷屏）
build_flags =
    -DCORE_DEBUG_LEVEL=1
